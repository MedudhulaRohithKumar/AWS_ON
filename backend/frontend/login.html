<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — CSR</title>
  <meta name="description" content="Sign in to the CSR UAT Instance Control Portal." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>⚡</text></svg>" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="login-page">
  <div class="login-card fade-in">
    <a href="index.html" class="nav-link" style="display:inline-flex; align-items:center; gap:6px; margin-bottom:18px; font-size:0.82rem; padding: 4px 10px;">← Back to Home</a>

    <!-- Logo -->
    <div class="login-logo">
      <div class="login-logo-icon">⚡</div>
      <div class="login-logo-name">CSR</div>
      <div class="login-logo-tagline">Cloud Server Resurrector · UAT Control Portal</div>
    </div>

    <!-- Error message -->
    <div id="loginError" class="login-error" role="alert">
      <span>⚠️</span>
      <span id="loginErrorMsg">Invalid credentials</span>
    </div>

    <!-- Form -->
    <form id="loginForm" class="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input
          id="username"
          type="text"
          class="form-control"
          placeholder="your.username"
          autocomplete="username"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input
          id="password"
          type="password"
          class="form-control"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        />
      </div>

      <button type="submit" id="loginBtn" class="btn btn-primary w-full" style="justify-content:center; margin-top:4px;">
        <span id="loginBtnText">Sign In</span>
        <span id="loginSpinner" class="spinner hidden" style="width:16px;height:16px;border-width:2px;"></span>
      </button>
    </form>

    <!-- Footer -->
    <div style="margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border); text-align: center;">
      <p class="text-sm text-muted">
        Don't have access?
        <span style="color: var(--text-secondary);">Contact your CSR administrator.</span>
      </p>
      <a href="docs.html" class="text-sm" style="margin-top: 8px; display: inline-block; color: var(--text-muted);">
        📄 How to use CSR →
      </a>
    </div>

  </div>
</div>

<script src="js/config.js"></script>
<script type="module">
import { login, isLoggedIn, isAdmin, showToast } from './js/api.js';

// Redirect if already logged in
if (isLoggedIn()) {
  window.location.href = isAdmin() ? 'admin.html' : 'dashboard.html';
}

const form    = document.getElementById('loginForm');
const errBox  = document.getElementById('loginError');
const errMsg  = document.getElementById('loginErrorMsg');
const btn     = document.getElementById('loginBtn');
const btnText = document.getElementById('loginBtnText');
const spinner = document.getElementById('loginSpinner');

function setLoading(loading) {
  btn.disabled  = loading;
  btnText.textContent = loading ? 'Signing in…' : 'Sign In';
  spinner.classList.toggle('hidden', !loading);
}

function showError(msg) {
  errMsg.textContent = msg;
  errBox.classList.add('visible');
  document.getElementById('password').value = '';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errBox.classList.remove('visible');

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  if (!username || !password) {
    showError('Please enter your username and password.');
    return;
  }

  setLoading(true);
  try {
    const user = await login(username, password);
    showToast(`Welcome back, ${user.username}! 👋`, 'success', 2000);
    setTimeout(() => {
      window.location.href = user.role === 'admin' ? 'admin.html' : 'dashboard.html';
    }, 600);
  } catch (err) {
    showError(err.message || 'Login failed. Please try again.');
    setLoading(false);
  }
});
</script>
</body>
</html>
